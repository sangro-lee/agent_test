data:
  raw_csv: "data/BACE1/bace1_clean_pic50.csv"
  smiles_col: "smiles"
  activity_col: "pIC50"
  activity_type: "pIC50"
  unit_col: null

features:
  type: "fingerprint"  # "fingerprint" | "graph" | "sme_graph"
  fp_bits: 2048
  fp_radius: 2
  use_chirality: false
  use_descriptors: false  # append RDKit 2D descriptors
  # SME-specific (used when type = "sme_graph")
  smask_type: "brics"    # "brics" | "murcko" | "none"

model:
  type: "mlp"  # "mlp" | "gnn" | "sme_rgcn"
  hidden_dims: [512, 256, 128]
  dropout: 0.2
  activation: "relu"
  # GNN / AttentiveFP-specific
  gnn_hidden: 200
  gnn_layers: 3
  gnn_dropout: 0.1
  # SME RGCN-specific (used when type = "sme_rgcn")
  sme_hidden_feats: [200, 200]   # RGCN layer dims
  sme_ffn_hidden: 200            # MLP head hidden dim
  sme_rgcn_dropout: 0.25
  sme_ffn_dropout: 0.25

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  weight_decay: 1e-5
  early_stopping_patience: 15
  checkpoint_every: 10
  val_fraction: 0.1
  test_fraction: 0.1
  split_type: "scaffold"  # "scaffold" or "random"
  seed: 42
  device: "auto"  # "auto", "cpu", "cuda", "mps"

output:
  run_root: "auto"  # auto = outputs/runs/YYYYMMDD_HHMMSS
  base_dir: "outputs/runs"

screening:
  top_k: 100
  score_col: "pred_pIC50"
