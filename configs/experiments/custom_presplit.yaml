data:
  smiles_col: "SMILES"
  label_col: "y"
  # raw_csv, activity_col, val_fraction, test_fraction, split_type
  # are unused when running preprocess.py with --train_csv/--val_csv

features:
  type: "graph"
  smask_type: "brics"
  use_chirality: false

model:
  type: "gnn"
  latent_dim: 4
  gnn_hidden: 128
  gnn_layers: 3
  gnn_dropout: 0.1

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  weight_decay: 1e-5
  early_stopping_patience: 20
  checkpoint_every: 10
  seed: 42
  device: "auto"

output:
  run_root: "outputs/runs/custom_presplit"  # 실험마다 바꿔줄 것

screening:
  top_k: 100
  score_col: "pred_pIC50"

diffusion:
  denoiser_type: "mlp"
  n_layers: 2
  time_dim: 32
  cond_dim: 32
