data:
  raw_csv: "data/BACE1/bace1_clean_pic50.csv"
  smiles_col: "smiles"
  activity_col: "pIC50"
  activity_type: "pIC50"
  unit_col: null

features:
  type: "fingerprint"
  fp_bits: 2048
  fp_radius: 2
  use_chirality: false
  use_descriptors: false

model:
  type: "mlp"
  latent_dim: 16
  hidden_dims: [256, 128, 64]
  dropout: 0.2
  activation: "relu"

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  weight_decay: 1e-5
  early_stopping_patience: 20
  checkpoint_every: 10
  val_fraction: 0.1
  test_fraction: 0.1
  split_type: "random"
  seed: 42
  device: "auto"

output:
  run_root: "auto"
  base_dir: "outputs/runs"

screening:
  top_k: 100
  score_col: "pred_pIC50"

diffusion:
  denoiser_type: "vqc_angle   # AngleVQCDenoiser, 16 qubits
  n_layers: 2
  time_dim: 32
  cond_dim: 32
