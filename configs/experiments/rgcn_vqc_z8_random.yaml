data:
  raw_csv: "data/BACE1/bace1_clean_pic50.csv"
  smiles_col: "smiles"
  activity_col: "pIC50"
  activity_type: "pIC50"
  unit_col: null

features:
  type: "sme_graph"
  fp_bits: 2048
  fp_radius: 2
  use_chirality: false
  use_descriptors: false
  smask_type: "brics"

model:
  type: "sme_rgcn"
  latent_dim: 8
  sme_hidden_feats: [256, 256]
  sme_ffn_dims: [128, 64]       # funnel: 256 → 128 → 64 → 8
  sme_rgcn_dropout: 0.25
  sme_ffn_dropout: 0.25

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  weight_decay: 1e-5
  early_stopping_patience: 20
  checkpoint_every: 10
  val_fraction: 0.1
  test_fraction: 0.1
  split_type: "random"
  seed: 42
  device: "auto"

output:
  run_root: "auto"
  base_dir: "outputs/runs"

screening:
  top_k: 100
  score_col: "pred_pIC50"

diffusion:
  denoiser_type: "vqc_angle_reupload"
  n_layers: 2
  time_dim: 32
  cond_dim: 32
  num_blocks: 6
  initial_cnot: false
