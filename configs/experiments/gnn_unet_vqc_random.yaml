data:
  raw_csv: "data/BACE1/bace1_clean_pic50.csv"
  smiles_col: "smiles"
  activity_col: "pIC50"
  activity_type: "pIC50"
  unit_col: null

features:
  type: "graph"
  fp_bits: 2048
  fp_radius: 2
  use_chirality: false
  use_descriptors: false
  smask_type: "brics"

model:
  type: "gnn"
  latent_dim: 256
  hidden_dims: [512, 256, 256]
  dropout: 0.2
  activation: "relu"
  gnn_hidden: 256
  gnn_layers: 3
  gnn_dropout: 0.1
  sme_hidden_feats: [256, 256]
  sme_ffn_hidden: 200
  sme_rgcn_dropout: 0.25
  sme_ffn_dropout: 0.25

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  weight_decay: 1e-5
  early_stopping_patience: 20
  checkpoint_every: 10
  val_fraction: 0.1
  test_fraction: 0.1
  split_type: "random"
  seed: 42
  device: "auto"

output:
  run_root: "auto"
  base_dir: "outputs/runs"

screening:
  top_k: 100
  score_col: "pred_pIC50"

diffusion:
  denoiser_type: "unet_vqc"   # HybridUNetDenoiser, VQC bottleneck
  unet_dims: [512, 32]        # 256→512→32, bottleneck=32 → 5 qubits (2^5=32)
  n_layers: 2                 # VQC circuit layers
  time_dim: 32    # timestep embedding dim
  cond_dim: 32    # condition (pIC50) embedding dim
