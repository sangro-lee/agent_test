data:
  raw_csv: "data/BACE1/bace1_clean_pic50.csv"
  smiles_col: "smiles"
  activity_col: "pIC50"
  activity_type: "pIC50"
  unit_col: null

features:
  type: "fingerprint"
  fp_bits: 2048
  fp_radius: 2
  use_chirality: false
  use_descriptors: false
  smask_type: "brics"

model:
  type: "mlp"
  use_vqc: true
  latent_dim: 8           # = n_qubits (VQC output dim)
  hidden_dims: [512, 256, 256]   # last = VQC input dim
  dropout: 0.2
  activation: "relu"
  gnn_hidden: 256
  gnn_layers: 3
  gnn_dropout: 0.1
  sme_hidden_feats: [256, 256]
  sme_ffn_hidden: 256
  sme_rgcn_dropout: 0.25
  sme_ffn_dropout: 0.25

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  weight_decay: 1e-5
  early_stopping_patience: 20
  checkpoint_every: 10
  val_fraction: 0.1
  test_fraction: 0.1
  split_type: "scaffold"
  seed: 42
  device: "auto"

output:
  run_root: "auto"
  base_dir: "outputs/runs"

screening:
  top_k: 100
  score_col: "pred_pIC50"

diffusion:
  denoiser_type: "mlp"
  unet_dims: [128, 64, 32]
  n_layers: 2
  time_dim: 128   # timestep embedding dim
  cond_dim: 128   # condition (pIC50) embedding dim
